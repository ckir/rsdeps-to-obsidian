[package]
name = "rsdeps2obsidian"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "rsdeps2obsidian"
path = "src/lib.rs"

[[bin]]
name = "rsdeps2obsidian"
path = "src/bin/rsdeps2obsidian.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
syn = { version = "2", features = ["full", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
